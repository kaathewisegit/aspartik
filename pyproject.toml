[project]
name = "aspartik"
dynamic = ["version", "author", "license"]
# Uses compression.zstd (PEP 784)
requires-python = ">=3.14"
classifiers = [
	"Programming Language :: Rust",
	"Programming Language :: Python :: Implementation :: CPython",
	"Typing :: Typed",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
	"Intended Audience :: Developers",
	"Intended Audience :: Science/Research",
]
keywords = ["bioinformatics"]

[project.optional-dependencies]
cli = ["cliclass~=0.1.0a1"]
analysis = [
	"polars~=1.43",
	"matplotlib~=3.11",
	"numpy~=2.5",
]

[dependency-groups]
dev = [
	"maturin[patchelf]~=1.14 ; sys_platform == 'linux'",
	"maturin~=1.14 ; sys_platform != 'linux'",
	"mpmath~=1.4",
	"gmpy2~=2.3",
	"polars~=1.43",
	"pdoc~=16.0",
	"ty~=0.0.72",
	"pytest~=9.1",
	"ruff~=0.16",
	"cliclass~=0.1.0a1", # duplicated from `cli`
	"dendropy>=5.0.10",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "aspartik._aspartik_rust_impl"
manifest-path = "crates/aspartik/Cargo.toml"
features = ["pyo3/extension-module"]
include = ["LICENSE"]

[tool.pytest]
testpaths = ["python/tests"]
python_files = ["*.py"]
strict_markers = true
markers = [
	"manual: slow tests which shouldn't be executed by default"
]

[tool.pyright]
reportUnsupportedDunderAll = false

[tool.ruff.lint]
select = ["E", "F", "I", "W", "RUF"]
ignore = ["E501", "F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
section-order = [
	"future",
	"third-party",
	"standard-library",
	"first-party",
	"local-folder",
]
known-first-party = ["aspartik"]
