[workspace]
resolver = "2"
members = [
	"crates/aspartik",
	"crates/b3",
	"crates/bitmap",
	"crates/data",
	"crates/io",
	"crates/linalg",
	"crates/math",
	"crates/profiler",
	"crates/rng",
	"crates/skvec",
	"crates/stats",
	"crates/util",
]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Andrej Kolčin <self@kaathewise.net>"]
repository = "https://github.com/kaathewisegit/aspartik"

[workspace.dependencies]
anyhow = "1.0"
arbitrary = "1.4"
arbtest = "0.3.2"
bincode = { version = "2.0", default-features = false }
blake3 = "1.8"
bytemuck = "1.24"
bytes = "1.10"
crossbeam-channel = "0.5.15"
cudarc = { version = "0.17.3", default-features = false }
divan = "0.1.21"
indoc = "2.0"
log = "0.4.28"
logos = "0.15.1"
nalgebra = { version = "0.34.1", default-features = false }
num-traits = "0.2.19"
parking_lot = "0.12.5"
petgraph = { version = "0.8.3", default-features = false }
pyo3 = "0.26.0"
rand = { version = "0.9.2", default-features = false }
rand_distr = "0.5.1"
rand_pcg = "0.9.0"
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"

b3 = { version = "0.1.0-alpha.3", path = "crates/b3" }
bitmap = { version = "0.1.0-alpha.3", path = "crates/bitmap" }
data = { version = "0.1.0-alpha.3", path = "crates/data" }
io = { version = "0.1.0-alpha.3", path = "crates/io" }
linalg = { version = "0.1.0-alpha.3", path = "crates/linalg" }
math = { version = "0.1.0-alpha.3", path = "crates/math" }
profiler = { version = "0.1.0-alpha.3", path = "crates/profiler" }
rng = { version = "0.1.0-alpha.3", path = "crates/rng" }
skvec = { version = "0.1.0-alpha.3", path = "crates/skvec" }
stats = { version = "0.1.0-alpha.3", path = "crates/stats" }
util = { version = "0.1.0-alpha.3", path = "crates/util" }

[workspace.lints.clippy]
branches_sharing_code = "warn"
cast_lossless = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"

[profile.release]
debug = true
