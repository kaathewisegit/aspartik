[workspace]
resolver = "2"
members = [
	"crates/aspartik",
	"crates/b3",
	"crates/bitmap",
	"crates/buffer",
	"crates/data",
	"crates/io",
	"crates/linalg",
	"crates/math",
	"crates/rng",
	"crates/sk",
	"crates/stats",
	"crates/util",
	"crates/verbatim",
]

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Andrej Kolčin <self@kaathewise.net>"]
repository = "https://github.com/kaathewisegit/aspartik"

[workspace.dependencies]
anyhow = "1.0"
arbitrary = "1.4"
arbtest = "0.3.2"
arrow-array = "58.0.0"
arrow-ipc = "58.0.0"
arrow-schema = "58.0.0"
blake3 = "1.8"
bytemuck = "1.25"
bytes = "1.11"
cc = "1.2"
cudarc = { version = "0.19.4", default-features = false }
fork_union = "2.3"
lapack-static = "0.1.0"
libc = "0.2.183"
libm = "0.2.16"
num-traits = "0.2.19"
parking_lot = "0.12.5"
peg = "0.8.5"
pyo3 = "0.28.2"
rand = { version = "0.10.0", default-features = false }
thiserror = "2.0"

rand_pcg = {
	git = "https://github.com/kaathewisegit/rust-random-rngs",
	branch = "pcg-state"
}

b3 = { version = "0.1.0-alpha.12", path = "crates/b3" }
bitmap = { version = "0.1.0-alpha.12", path = "crates/bitmap" }
buffer = { version = "0.1.0-alpha.12", path = "crates/buffer" }
data = { version = "0.1.0-alpha.12", path = "crates/data" }
io = { version = "0.1.0-alpha.12", path = "crates/io" }
linalg = { version = "0.1.0-alpha.12", path = "crates/linalg" }
math = { version = "0.1.0-alpha.12", path = "crates/math", default-features = false }
rng = { version = "0.1.0-alpha.12", path = "crates/rng" }
sk = { version = "0.1.0-alpha.12", path = "crates/sk" }
stats = { version = "0.1.0-alpha.12", path = "crates/stats" }
util = { version = "0.1.0-alpha.12", path = "crates/util" }
verbatim = { version = "0.1.0-alpha.12", path = "crates/verbatim" }

[workspace.lints.clippy]
branches_sharing_code = "warn"
cast_lossless = "warn"
default_trait_access = "warn"
derive_partial_eq_without_eq = "warn"
undocumented_unsafe_blocks = "warn"

# String API is much nicer to work with than the formatting one
to_string_trait_impl = "allow"

[profile.profile]
inherits = "release"
debug = true
