[package]
name = "data"
description = "Bioinformatics data structures and Sans IO parsing"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rng = { workspace = true, optional = true }
util = { workspace = true }

anyhow = { workspace = true }
arbitrary = { workspace = true, optional = true, features = ["derive"] }
bytemuck = { workspace = true, features = ["derive"] }
computare-buffer = { workspace = true }
computare-linalg = { workspace = true }
fork_union = { workspace = true }
hashbrown = { workspace = true }
logos = { workspace = true }
parking_lot = { workspace = true, optional = true }
picoarrow = { workspace = true }
pyo3 = { workspace = true, features = ["anyhow"], optional = true }
rand = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
arbitrary = { workspace = true }
arbtest = { workspace = true }
computare-core = { workspace = true }
rand_pcg = { workspace = true }

[features]
default = ["python"]
python = ["dep:rng", "dep:pyo3", "dep:parking_lot"]
arbitrary = ["dep:arbitrary"]

[lints]
workspace = true
