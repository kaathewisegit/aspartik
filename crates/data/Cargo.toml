[package]
name = "data"
description = "Bioinformatics data structures and Sans IO parsing"

version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
linalg = { workspace = true }
util = { workspace = true }

anyhow = { workspace = true }
bytes = { workspace = true }
