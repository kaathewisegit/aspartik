name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        platform: [ubuntu-24.04, macos-14, windows-2022]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.1"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15"

      - name: Install Biome
        uses: biomejs/setup-biome@v2
        with:
          working-dir: "website/"

      - name: Install Python dependencies
        run: |
          uv sync
          uv pip install gmpy2
          uv run -m python.toolkit build

      - name: Setup website dependencies
        run: |
          uv run --no-sync -m python.toolkit pdoc
          cd website/
          npm ci

      - name: Tests
        run: uv run --no-sync -m python.toolkit check
