name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        platform: [windows-2022, ubuntu-24.04, macos-14]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"

      - name: Install Node
        uses: actions/setup-node@v6

      - name: Install Biome
        uses: biomejs/setup-biome@v2

      - name: Install Python dependencies
        run: |
          uv sync --extra dev
          uv pip install gmpy2

      - name: Setup website dependencies
        run: |
          uv run -m python.toolkit pdoc
          cd website/
          npm ci

      - name: Tests
        run: uv run -m python.toolkit check
