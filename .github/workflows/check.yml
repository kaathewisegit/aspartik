name: CI

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        platform: [windows-2022, ubuntu-24.04, macos-14]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.21"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Biome
        uses: biomejs/setup-biome@v2

      - name: Install Python dependencies
        run: |
          uv sync --extra dev
          uv pip install gmpy2

      - name: Initialize Astro
        run: |
          uv run -m python.toolkit pdoc
          cd website/
          bun install
          bun x astro sync

      - name: Run the checks
        run: uv run -m python.toolkit check
