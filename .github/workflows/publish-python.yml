name: Publish PyPI wheels

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Pull dependencies
        run: |
          uv sync --no-install-project

      - name: Build wheels
        run: |
          uv run --no-sync -m python.toolkit build

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: target/wheels/

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Pull dependencies
        run: |
          uv sync --no-install-project

      - name: Build wheels
        run: |
          uv run --no-sync -m python.toolkit build

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: target/wheels/

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Pull dependencies
        run: |
          uv sync --no-install-project

      - name: Build wheels
        run: |
          uv run --no-sync -m python.toolkit build

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: target/wheels/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Pull dependencies
        run: |
          uv sync --no-install-project

      - name: Build wheels
        run: |
          uv run --no-sync -m python.toolkit sdist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: target/sdist/

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: astral-sh/setup-uv@v6
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
